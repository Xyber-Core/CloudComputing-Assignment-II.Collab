
name: PrintPortal CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: "ProjectImplementation[PrintPortal]/API/package-lock.json"

      - name: Check project structure
        run: |
          echo "Current directory:"
          pwd
          echo "Repository files:"
          ls -la
          echo "API directory:"
          ls -la "ProjectImplementation[PrintPortal]/API"

      - name: Install API dependencies
        working-directory: "ProjectImplementation[PrintPortal]/API"
        run: npm ci

      - name: Run API tests
        working-directory: "ProjectImplementation[PrintPortal]/API"
        run: npm test
