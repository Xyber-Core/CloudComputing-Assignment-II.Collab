name: PrintPortal CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: 'ProjectImplementation[PrintPortal]/package-lock.json'

      - name: Install API dependencies
        working-directory: 'ProjectImplementation[PrintPortal]'
        run: npm ci

      - name: Run API tests
        working-directory: 'ProjectImplementation[PrintPortal]'
        run: npm test