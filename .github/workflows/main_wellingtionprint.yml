
name: Build and deploy Wellington Print Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: wellingtionprint
  AZURE_WEBAPP_PACKAGE_PATH: 'ProjectImplementationPrintPortal/Frontend/Public'
  NODE_VERSION: '22.x'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check frontend files
        run: |
          ls -la "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
          test -f "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}/index.html"

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./website

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./website
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
